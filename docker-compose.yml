services:
  main:
    restart: always
    image: main:latest
    deploy:
      replicas: 1
    # The site needs no configuration. The ideas API needs credentials, and
    # stays unmounted without them, so a host with no .env still serves.
    env_file:
      - path: .env
        required: false
    environment:
      MAIN_ADDR: main:80
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy
networks:
  traefik_proxy:
    external: true
